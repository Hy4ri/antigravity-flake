name: Update Antigravity

on:
  schedule:
    # Run every day at 17:00 UTC (5:00 PM) to catch typical afternoon releases
    - cron: '0 17 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-antigravity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      fail_reason: ${{ steps.check.outputs.fail_reason }}
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        continue-on-error: true
        run: |
          ERR_LOG="$(mktemp)"
          die() {
            echo "fail_reason=$1" | tr -d '\n\r' >> "$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }
          # Harden the fetches: fail fast on connect, retry transient errors,
          # and capture the last error into ERR_LOG for the failure report.
          fetch_url() {
            curl -fsSL --compressed --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --retry-all-errors "$1" 2>>"$ERR_LOG" || true
          }

          echo "=== Checking current versions ==="
          CURRENT_CLI=$(jq -r '.cli.version' version.json)
          CURRENT_HUB=$(jq -r '.hub.version' version.json)
          CURRENT_IDE=$(jq -r '.ide.version' version.json)
          CURRENT_SDK=$(jq -r '.sdk.version' version.json)

          echo "Current CLI: $CURRENT_CLI"
          echo "Current Hub: $CURRENT_HUB"
          echo "Current IDE: $CURRENT_IDE"
          echo "Current SDK: $CURRENT_SDK"

          echo "=== Fetching latest versions ==="

          # Fetch latest CLI version from auto-updater service
          LATEST_CLI_MANIFEST=$(fetch_url "https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json")
          if [ -z "$LATEST_CLI_MANIFEST" ]; then
            die "Failed to fetch latest CLI manifest. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
          fi
          LATEST_CLI=$(echo "$LATEST_CLI_MANIFEST" | jq -r '.url' | grep -oP 'antigravity-cli/\K[^/]+')
          if [ -z "$LATEST_CLI" ]; then
            die "Failed to parse latest CLI version from manifest."
          fi
          echo "Latest CLI found: $LATEST_CLI"

          # Fetch latest Hub version from download page
          LATEST_HUB=$(fetch_url "https://antigravity.google/download" | grep -oP 'antigravity-hub/\K[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | sort -V | tail -n 1)
          if [ -z "$LATEST_HUB" ]; then
            die "Failed to fetch latest Hub version from download page. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
          fi
          echo "Latest Hub found: $LATEST_HUB"

          # Fetch latest IDE version from download page
          LATEST_IDE=$(fetch_url "https://antigravity.google/download" | grep -oP 'edgedl/release2/j0qc3/antigravity/stable/\K[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | sort -V | tail -n 1)
          if [ -z "$LATEST_IDE" ]; then
            die "Failed to fetch latest IDE version from download page. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
          fi
          echo "Latest IDE found: $LATEST_IDE"

          # Fetch latest SDK version from PyPI API
          LATEST_SDK=$(fetch_url "https://pypi.org/pypi/google-antigravity/json" | jq -r '.info.version')
          if [ -z "$LATEST_SDK" ] || [ "$LATEST_SDK" = "null" ]; then
            die "Failed to fetch latest SDK version from PyPI. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
          fi
          echo "Latest SDK found: $LATEST_SDK"

          echo "fail_reason=" >> "$GITHUB_OUTPUT"

          UPDATE_NEEDED="false"
          UPDATE_CLI=""
          UPDATE_HUB=""
          UPDATE_IDE=""
          UPDATE_SDK=""

          if [ "$LATEST_CLI" != "$CURRENT_CLI" ] && [ "$(printf '%s\n' "$CURRENT_CLI" "$LATEST_CLI" | sort -V | tail -n 1)" = "$LATEST_CLI" ]; then
            echo "New CLI version available: $LATEST_CLI"
            UPDATE_NEEDED="true"
            UPDATE_CLI="$LATEST_CLI"
          fi

          if [ "$LATEST_HUB" != "$CURRENT_HUB" ] && [ "$(printf '%s\n' "$CURRENT_HUB" "$LATEST_HUB" | sort -V | tail -n 1)" = "$LATEST_HUB" ]; then
            echo "New Hub version available: $LATEST_HUB"
            UPDATE_NEEDED="true"
            UPDATE_HUB="$LATEST_HUB"
          fi

          if [ "$LATEST_IDE" != "$CURRENT_IDE" ] && [ "$(printf '%s\n' "$CURRENT_IDE" "$LATEST_IDE" | sort -V | tail -n 1)" = "$LATEST_IDE" ]; then
            echo "New IDE version available: $LATEST_IDE"
            UPDATE_NEEDED="true"
            UPDATE_IDE="$LATEST_IDE"
          fi

          if [ "$LATEST_SDK" != "$CURRENT_SDK" ] && [ "$(printf '%s\n' "$CURRENT_SDK" "$LATEST_SDK" | sort -V | tail -n 1)" = "$LATEST_SDK" ]; then
            echo "New SDK version available: $LATEST_SDK"
            UPDATE_NEEDED="true"
            UPDATE_SDK="$LATEST_SDK"
          fi

          echo "update_needed=$UPDATE_NEEDED" >> $GITHUB_OUTPUT
          echo "update_cli=$UPDATE_CLI" >> $GITHUB_OUTPUT
          echo "update_hub=$UPDATE_HUB" >> $GITHUB_OUTPUT
          echo "update_ide=$UPDATE_IDE" >> $GITHUB_OUTPUT
          echo "update_sdk=$UPDATE_SDK" >> $GITHUB_OUTPUT

      - name: Update Flake
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ARGS=""
          [[ -n "${{ steps.check.outputs.update_cli }}" ]] && ARGS="$ARGS --cli ${{ steps.check.outputs.update_cli }}"
          [[ -n "${{ steps.check.outputs.update_hub }}" ]] && ARGS="$ARGS --hub ${{ steps.check.outputs.update_hub }}"
          [[ -n "${{ steps.check.outputs.update_ide }}" ]] && ARGS="$ARGS --ide ${{ steps.check.outputs.update_ide }}"
          [[ -n "${{ steps.check.outputs.update_sdk }}" ]] && ARGS="$ARGS --sdk ${{ steps.check.outputs.update_sdk }}"
          ./update-version.sh $ARGS

      - name: Update flake.lock
        if: steps.check.outputs.update_needed == 'true'
        run: nix flake update

      - name: Verify Flake
        if: steps.check.outputs.update_needed == 'true'
        run: |
          nix flake check --no-build
          nix build .#antigravity-cli .#antigravity .#antigravity-ide .#antigravity-sdk --no-link

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json flake.lock

          # Collect updated components
          UPDATES=""
          [[ -n "${{ steps.check.outputs.update_cli }}" ]] && UPDATES="$UPDATES CLI→${{ steps.check.outputs.update_cli }}"
          [[ -n "${{ steps.check.outputs.update_hub }}" ]] && UPDATES="$UPDATES Hub→${{ steps.check.outputs.update_hub }}"
          [[ -n "${{ steps.check.outputs.update_ide }}" ]] && UPDATES="$UPDATES IDE→${{ steps.check.outputs.update_ide }}"
          [[ -n "${{ steps.check.outputs.update_sdk }}" ]] && UPDATES="$UPDATES SDK→${{ steps.check.outputs.update_sdk }}"

          # Remove leading space
          UPDATES="${UPDATES# }"

          if [[ "$UPDATES" == *" "* ]]; then
            # Multiple components: "chore: update CLI→1.0.3, Hub→2.0.7"
            MSG="chore: update ${UPDATES}"
          else
            # Single component: "chore(cli): update to 1.0.3"
            SCOPE="${UPDATES%%→*}"
            VERSION="${UPDATES##*→}"
            MSG="chore(${SCOPE,,}): update to ${VERSION}"
          fi

          echo "Commit message: $MSG"
          git commit -m "$MSG" || echo "Nothing to commit"
          git push

      - name: Close resolved failure issues
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number')
          for n in $OPEN; do
            echo "Closing auto-failure issue #$n (workflow succeeded again)"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The Update Antigravity workflow succeeded again — closing automatically."
          done

      # continue-on-error above would let the job pass; fail the run when the check failed.
      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1

  report-failure:
    runs-on: ubuntu-latest
    needs: update-antigravity
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          REASON="${{ needs.update-antigravity.outputs.fail_reason }}"
          [ -n "$REASON" ] || REASON="See the failed run logs for details."

          TITLE="[auto] Update Antigravity workflow failed"
          BODY=$(printf 'The **Update Antigravity** workflow failed on %s.\n\n- Run: %s/%s/actions/runs/%s\n- Job: update-antigravity\n\n**Failure reason:** %s\n\n_This issue was created automatically. It will be closed automatically when the workflow succeeds again._\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$REASON")

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Failure issue #$EXISTING already open — adding comment instead."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — $REASON"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
