name: Build Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build all antigravity packages
        run: |
          nix flake check --no-build
          nix build .#antigravity-cli .#antigravity .#antigravity-ide .#antigravity-sdk .#antigravity-fhs --no-link
