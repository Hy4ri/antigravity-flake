name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.nix'
      - 'version.json'
      - 'flake.lock'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build antigravity packages
        run: |
          nix flake check --no-build
          nix build .#antigravity-cli .#antigravity .#antigravity-ide .#antigravity-sdk --no-link
